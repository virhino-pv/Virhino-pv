<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 125" width="100%" height="125">
  <defs>
    <!-- Background Gradient (Deep Space Obsidian & Purple Violet) -->
    <linearGradient id="q-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080816" />
      <stop offset="50%" stop-color="#110d28" />
      <stop offset="100%" stop-color="#060714" />
    </linearGradient>

    <!-- Border Gradient (Electric Purple to Cyan) -->
    <linearGradient id="q-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="35%" stop-color="#a855f7" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Glowing Text Filter -->
    <filter id="q-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="q-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#818cf8" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="840" height="125" rx="14" fill="url(#q-bg)" stroke="url(#q-border)" stroke-width="1.4" />
  <rect width="840" height="125" rx="14" fill="url(#q-grid)" />

  <!-- Corner Cyber Accents -->
  <path d="M 10 24 L 10 10 L 24 10" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M 830 24 L 830 10 L 816 10" stroke="#c084fc" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M 10 101 L 10 115 L 24 115" stroke="#a855f7" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M 830 101 L 830 115 L 816 115" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Big Glowing Quote Mark -->
  <text x="36" y="58" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#a855f7" opacity="0.85" filter="url(#q-glow)">&#8220;</text>

  <!-- Quote Text Line 1 -->
  <text x="76" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-style="italic" font-weight="500" fill="#f8fafc">
    &#8220;We don&#8217;t just write software &#8212; we engineer intelligent systems that turn bold ideas into scalable digital reality.&#8221;
  </text>

  <!-- Attribution Line -->
  <text x="785" y="92" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1">
    &#8212; VIGNESH G <tspan fill="#a855f7" font-weight="500">&#8226; Founder at Virhino</tspan>
  </text>
</svg>