<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80" width="100%" height="80">
  <defs>
    <linearGradient id="footer-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0" />
      <stop offset="30%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </linearGradient>
    <filter id="f-glow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Glowing Neon Divider Line -->
  <line x1="50" y1="20" x2="850" y2="20" stroke="url(#footer-grad)" stroke-width="2" filter="url(#f-glow)" />

  <!-- Center Diamond & Tech Mark -->
  <polygon points="450,14 457,20 450,26 443,20" fill="#38bdf8" filter="url(#f-glow)" />
  <circle cx="425" cy="20" r="2.5" fill="#a855f7" />
  <circle cx="475" cy="20" r="2.5" fill="#c084fc" />

  <text x="450" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="2">
    FOUNDED &amp; ENGINEERED BY <tspan fill="#a855f7" font-weight="700">VIGNESH G</tspan> &#8226; <tspan fill="#38bdf8" font-weight="700">VIRHINO</tspan> &#8226; &#169; 2026
  </text>
</svg>
