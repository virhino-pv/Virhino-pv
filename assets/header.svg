<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient (Deep Cyber Purple & Cosmic Navy) -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070714" />
      <stop offset="45%" stop-color="#0f0c29" />
      <stop offset="75%" stop-color="#140f34" />
      <stop offset="100%" stop-color="#060814" />
    </linearGradient>

    <!-- Purple & Electric Cyan/Blue Holographic Gradient for Vignesh G -->
    <linearGradient id="holo-glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="25%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="75%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#00f5ff" />
      <animate attributeName="x1" from="-100%" to="100%" dur="6s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="200%" dur="6s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Glowing Border Gradient (Electric Purple to Neon Cyan) -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="30%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Badge Linear Gradient -->
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.3" />
    </linearGradient>

    <!-- Filters for Intense Neon Glow -->
    <filter id="glow-purple-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ambient-blur">
      <feGaussianBlur stdDeviation="50" />
    </filter>

    <!-- Tech Grid Pattern with Cyber Purple/Blue Highlights -->
    <pattern id="tech-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#818cf8" stroke-width="0.65" stroke-opacity="0.12" />
      <circle cx="32" cy="0" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Rhino Geometric Watermark -->
    <linearGradient id="rhino-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Outfit", sans-serif;
      font-weight: 900;
      font-size: 46px;
      letter-spacing: 5px;
      text-transform: uppercase;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      fill: #38bdf8;
    }
    .pulse-dot {
      animation: pulse 2.2s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { opacity: 0.3; r: 4px; }
      50% { opacity: 1; r: 6.5px; }
      100% { opacity: 0.3; r: 4px; }
    }
    .shimmer-line {
      animation: dash 8s linear infinite;
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -100;
      }
    }
  </style>

  <!-- Background Rect -->
  <rect width="900" height="240" rx="16" fill="url(#bg-grad)" />

  <!-- Ambient Radiant Auras (Purple & Cyan) -->
  <circle cx="160" cy="80" r="110" fill="#9333ea" opacity="0.28" filter="url(#ambient-blur)" />
  <circle cx="760" cy="140" r="120" fill="#0284c7" opacity="0.22" filter="url(#ambient-blur)" />
  <circle cx="450" cy="180" r="90" fill="#6366f1" opacity="0.18" filter="url(#ambient-blur)" />

  <!-- Subtle Tech Grid -->
  <rect width="900" height="240" rx="16" fill="url(#tech-grid)" />

  <!-- Geometric Cyber Wireframe Elements (Rhino Horn / Angle motif) -->
  <g opacity="0.25" transform="translate(730, 25)">
    <polygon points="40,10 110,60 90,140 20,110" fill="url(#rhino-grad)" stroke="#38bdf8" stroke-width="1.2" />
    <polygon points="20,110 90,140 60,170 0,130" fill="none" stroke="#a855f7" stroke-width="1" />
    <line x1="40" y1="10" x2="90" y2="140" stroke="#c084fc" stroke-width="0.8" stroke-dasharray="4 3" />
  </g>

  <!-- Left Cyber Shield Mark -->
  <g opacity="0.2" transform="translate(60, 45)">
    <polygon points="30,0 60,20 60,60 30,80 0,60 0,20" fill="none" stroke="#818cf8" stroke-width="1.5" />
    <polygon points="30,12 48,25 48,55 30,68 12,55 12,25" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 2" />
  </g>

  <!-- Border Outline -->
  <rect x="1.5" y="1.5" width="897" height="237" rx="15" fill="none" stroke="url(#border-grad)" stroke-width="1.5" stroke-opacity="0.75" />

  <!-- Cybernetic Corner Accents -->
  <!-- Top-Left -->
  <path d="M 14 34 L 14 16 L 34 16" stroke="#38bdf8" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <circle cx="16" cy="16" r="2.5" fill="#a855f7" />
  <!-- Top-Right -->
  <path d="M 886 34 L 886 16 L 866 16" stroke="#c084fc" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <circle cx="884" cy="16" r="2.5" fill="#38bdf8" />
  <!-- Bottom-Left -->
  <path d="M 14 206 L 14 224 L 34 224" stroke="#c084fc" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <circle cx="16" cy="224" r="2.5" fill="#38bdf8" />
  <!-- Bottom-Right -->
  <path d="M 886 206 L 886 224 L 866 224" stroke="#38bdf8" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <circle cx="884" cy="224" r="2.5" fill="#a855f7" />

  <!-- Top Pill / Status Tag: FOUNDER @ VIRHINO -->
  <g transform="translate(450, 42)">
    <rect x="-160" y="-14" width="320" height="28" rx="14" fill="url(#badge-grad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="-136" cy="0" r="4.5" fill="#38bdf8" class="pulse-dot" />
    <text x="-122" y="4" class="badge-text" text-anchor="start">
      FOUNDER &amp; CEO &#8226; VIRHINO.COM
    </text>
  </g>

  <!-- Main Title: VIGNESH G -->
  <g transform="translate(450, 108)">
    <!-- Shadow Glow for text -->
    <text x="0" y="0" text-anchor="middle" class="title-text" fill="#a855f7" opacity="0.4" filter="url(#glow-purple-blue)">
      VIGNESH G
    </text>
    <!-- Gradient Text -->
    <text x="0" y="0" text-anchor="middle" class="title-text" fill="url(#holo-glow-grad)">
      VIGNESH G
    </text>
  </g>

  <!-- Subtitle Tagline: THINK. BUILD. GROW. -->
  <g transform="translate(450, 146)">
    <text x="0" y="0" text-anchor="middle" class="subtitle-text">
      <tspan fill="#a855f7">THINK</tspan> &#8226; <tspan fill="#38bdf8">BUILD</tspan> &#8226; <tspan fill="#c084fc">GROW</tspan>
    </text>
  </g>

  <!-- Domain & Capabilities Bottom Strip -->
  <g transform="translate(450, 185)">
    <!-- Left Capsule -->
    <rect x="-350" y="-12" width="220" height="24" rx="12" fill="#0f1123" stroke="#9333ea" stroke-width="0.8" stroke-opacity="0.6" />
    <text x="-240" y="4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle" letter-spacing="1.2">
      ⚡ SOFTWARE &amp; SAAS
    </text>

    <!-- Center Capsule -->
    <rect x="-115" y="-12" width="230" height="24" rx="12" fill="#0f1123" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.7" />
    <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1.2">
      🧠 AI &amp; AUTONOMOUS AGENTS
    </text>

    <!-- Right Capsule -->
    <rect x="130" y="-12" width="220" height="24" rx="12" fill="#0f1123" stroke="#a855f7" stroke-width="0.8" stroke-opacity="0.6" />
    <text x="240" y="4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle" letter-spacing="1.2">
      🚀 BUSINESS AUTOMATION
    </text>
  </g>

  <!-- Bottom Mini Decorative Line -->
  <line x1="280" y1="216" x2="620" y2="216" stroke="url(#holo-glow-grad)" stroke-width="1.2" stroke-opacity="0.5" />
</svg>
